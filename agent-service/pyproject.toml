[project]
name = "agent-service"
version = "0.1.0"
description = "Polychoron AI - Agent Orchestration Service (LangGraph nodes, Temporal workflows, model inference router)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "temporalio>=1.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    # psycopg (v3) has no pure-Python pq wrapper bundled by default —
    # langgraph-checkpoint-postgres pulls in bare "psycopg" only, which
    # fails at import with "no pq wrapper available" unless the binary
    # extra is also installed.
    "psycopg[binary,pool]>=3.1",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    # Regulatory KB source extraction (text layer only — no OCR).
    "pypdf>=4.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
